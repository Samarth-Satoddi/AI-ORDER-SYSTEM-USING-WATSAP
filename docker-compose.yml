services:
  postgres:
    image: postgres:16
    container_name: hotel_orders_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_orders
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_orders"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

